<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sentiment to Ad Converter — AI Tool</title>
  <style>
    /* ── Reset & Base ───────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0F172A;
      color: #E2E8F0;
      min-height: 100vh;
      padding: 32px 16px;
    }

    /* ── Container ──────────────────────────────────── */
    .container {
      max-width: 780px;
      margin: 0 auto;
      background: #1E293B;
      border-radius: 20px;
      padding: 40px 44px;
      box-shadow: 0 24px 80px rgba(0,0,0,0.5);
    }

    /* ── Header ─────────────────────────────────────── */
    header {
      text-align: center;
      margin-bottom: 36px;
      padding-bottom: 28px;
      border-bottom: 1px solid #334155;
    }
    .logo-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 8px;
    }
    .logo-icon {
      width: 46px; height: 46px;
      background: linear-gradient(135deg, #6366F1, #8B5CF6);
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 22px;
    }
    header h1 {
      font-size: 1.9rem;
      font-weight: 800;
      background: linear-gradient(135deg, #6366F1, #A78BFA);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    header p {
      color: #94A3B8;
      font-size: 1rem;
      margin-top: 6px;
    }
    .badge-row {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-top: 14px;
      flex-wrap: wrap;
    }
    .badge {
      background: #0F172A;
      border: 1px solid #334155;
      color: #94A3B8;
      font-size: 0.72rem;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 20px;
      letter-spacing: 0.03em;
    }
    .badge.green  { border-color: #10B981; color: #10B981; }
    .badge.indigo { border-color: #6366F1; color: #A5B4FC; }

    /* ── Labels ─────────────────────────────────────── */
    label {
      display: block;
      font-size: 0.82rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #94A3B8;
      margin-bottom: 8px;
      margin-top: 22px;
    }

    /* ── Textarea ───────────────────────────────────── */
    textarea {
      width: 100%;
      padding: 16px;
      background: #0F172A;
      color: #E2E8F0;
      border: 1.5px solid #334155;
      border-radius: 12px;
      font-size: 0.95rem;
      line-height: 1.6;
      resize: vertical;
      transition: border-color 0.2s, box-shadow 0.2s;
      font-family: inherit;
    }
    textarea:focus {
      outline: none;
      border-color: #6366F1;
      box-shadow: 0 0 0 3px rgba(99,102,241,0.2);
    }
    textarea::placeholder { color: #475569; }

    /* ── Select ─────────────────────────────────────── */
    .select-wrapper {
      position: relative;
    }
    .select-wrapper::after {
      content: '▾';
      position: absolute;
      right: 14px; top: 50%;
      transform: translateY(-50%);
      color: #6366F1;
      pointer-events: none;
      font-size: 1rem;
    }
    select {
      width: 100%;
      padding: 13px 16px;
      background: #0F172A;
      color: #E2E8F0;
      border: 1.5px solid #334155;
      border-radius: 12px;
      font-size: 0.95rem;
      cursor: pointer;
      appearance: none;
      font-family: inherit;
      transition: border-color 0.2s;
    }
    select:focus {
      outline: none;
      border-color: #6366F1;
      box-shadow: 0 0 0 3px rgba(99,102,241,0.2);
    }
    select option { background: #1E293B; }

    /* ── Button ─────────────────────────────────────── */
    .btn-generate {
      width: 100%;
      margin-top: 22px;
      padding: 16px;
      background: linear-gradient(135deg, #6366F1, #8B5CF6);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: 0.02em;
      transition: opacity 0.2s, transform 0.15s, box-shadow 0.2s;
      box-shadow: 0 4px 20px rgba(99,102,241,0.35);
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .btn-generate:hover:not(:disabled) {
      opacity: 0.92;
      transform: translateY(-1px);
      box-shadow: 0 6px 28px rgba(99,102,241,0.45);
    }
    .btn-generate:active:not(:disabled) { transform: translateY(0); }
    .btn-generate:disabled {
      background: #334155;
      box-shadow: none;
      cursor: not-allowed;
      opacity: 0.6;
    }

    /* ── Loading ────────────────────────────────────── */
    #loading {
      display: none;
      text-align: center;
      padding: 28px;
      margin-top: 20px;
    }
    .spinner {
      width: 36px; height: 36px;
      border: 3px solid #334155;
      border-top-color: #6366F1;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 14px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loading p { color: #94A3B8; font-size: 0.9rem; }

    /* ── Output Section ─────────────────────────────── */
    #output {
      display: none;
      margin-top: 28px;
      background: #0F172A;
      border-radius: 16px;
      border: 1px solid #334155;
      overflow: hidden;
    }
    .output-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      background: #1E293B;
      border-bottom: 1px solid #334155;
    }
    .output-header h2 {
      font-size: 1rem;
      font-weight: 700;
      color: #A5B4FC;
      display: flex; align-items: center; gap: 8px;
    }
    .btn-copy {
      background: #1E293B;
      color: #94A3B8;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 7px 14px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: flex; align-items: center; gap: 6px;
    }
    .btn-copy:hover {
      background: #334155;
      color: #E2E8F0;
      border-color: #475569;
    }
    .btn-copy.copied {
      background: #065F46;
      color: #6EE7B7;
      border-color: #10B981;
    }
    #adsResult {
      padding: 24px;
      white-space: pre-wrap;
      font-size: 0.92rem;
      line-height: 1.8;
      color: #CBD5E1;
      font-family: inherit;
    }

    /* ── Error Box ──────────────────────────────────── */
    .error-box {
      display: none;
      margin-top: 16px;
      padding: 14px 18px;
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid #EF4444;
      border-radius: 10px;
      color: #FCA5A5;
      font-size: 0.9rem;
    }

    /* ── Footer ─────────────────────────────────────── */
    footer {
      text-align: center;
      margin-top: 28px;
      color: #475569;
      font-size: 0.78rem;
    }
    footer a { color: #6366F1; text-decoration: none; }

    /* ── Responsive ─────────────────────────────────── */
    @media (max-width: 520px) {
      .container { padding: 28px 20px; }
      header h1  { font-size: 1.5rem; }
    }
  </style>
</head>
<body>

<div class="container">

  <!-- Header -->
  <header>
    <div class="logo-row">
      <div class="logo-icon">🤖</div>
      <h1>Sentiment → Ad Converter</h1>
    </div>
    <p>Paste customer reviews. Get professional ad copy instantly.</p>
    <div class="badge-row">
      <span class="badge indigo">Powered by Claude AI</span>
      <span class="badge green">✓ Free to Use</span>
      <span class="badge">Facebook · Google · Email</span>
    </div>
  </header>

  <!-- Input Section -->
  <section>
    <label>📝 Paste Customer Reviews Here</label>
    <textarea id="reviews" rows="8"
      placeholder="Example: I was amazed by how fast the delivery was. The product quality exceeded my expectations. I've already recommended it to 5 friends — worth every penny!"></textarea>

    <label>🎯 Generate Ad Copy For</label>
    <div class="select-wrapper">
      <select id="platform">
        <option value="all">✦ All Platforms (Facebook + Google + Email)</option>
        <option value="facebook">Facebook Ads Only</option>
        <option value="google">Google Ads Only</option>
        <option value="email">Email Subject Lines Only</option>
      </select>
    </div>

    <button class="btn-generate" id="generateBtn" onclick="generateAds()">
      ✨ Generate Ad Copies
    </button>

    <!-- Error Box -->
    <div class="error-box" id="errorBox"></div>
  </section>

  <!-- Loading -->
  <div id="loading">
    <div class="spinner"></div>
    <p>Claude is analyzing your reviews and crafting ad copies...</p>
  </div>

  <!-- Output -->
  <div id="output">
    <div class="output-header">
      <h2>📋 Your Generated Ad Copies</h2>
      <button class="btn-copy" id="copyBtn" onclick="copyAll()">📋 Copy All</button>
    </div>
    <div id="adsResult"></div>
  </div>

</div>

<!-- Footer -->
<footer>
  Built with <a href="https://anthropic.com" target="_blank">Anthropic Claude API</a> · Free & Open Source
</footer>

<script>
  async function generateAds() {
    const reviews  = document.getElementById('reviews').value.trim();
    const platform = document.getElementById('platform').value;
    const btn      = document.getElementById('generateBtn');
    const loading  = document.getElementById('loading');
    const output   = document.getElementById('output');
    const errorBox = document.getElementById('errorBox');

    // Clear previous state
    errorBox.style.display = 'none';
    output.style.display   = 'none';

    // Validate
    if (!reviews || reviews.length < 20) {
      errorBox.textContent = '⚠️ Please paste at least one full customer review (minimum 20 characters).';
      errorBox.style.display = 'block';
      return;
    }

    // UI: loading state
    btn.disabled        = true;
    btn.innerHTML       = '<span class="spinner" style="width:18px;height:18px;border-width:2px;margin:0"></span> Generating...';
    loading.style.display = 'block';

    try {
      const response = await fetch('https://sentiment-ad-converter.onrender.com/generate', {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify({ reviews, platform })
      });

      const data = await response.json();

      if (!response.ok || data.error) {
        throw new Error(data.error || 'Server returned an error.');
      }

      // Display result
      document.getElementById('adsResult').textContent = data.ads;
      output.style.display = 'block';

      // Smooth scroll to output
      output.scrollIntoView({ behavior: 'smooth', block: 'start' });

    } catch (err) {
      errorBox.textContent = '❌ ' + (err.message.includes('fetch')
        ? 'Cannot connect to server. Make sure app.py is running (python app.py).'
        : err.message);
      errorBox.style.display = 'block';
    } finally {
      btn.disabled  = false;
      btn.innerHTML = '✨ Generate Ad Copies';
      loading.style.display = 'none';
    }
  }

  async function copyAll() {
    const text = document.getElementById('adsResult').textContent;
    const btn  = document.getElementById('copyBtn');
    try {
      await navigator.clipboard.writeText(text);
      btn.textContent = '✓ Copied!';
      btn.classList.add('copied');
      setTimeout(() => {
        btn.textContent = '📋 Copy All';
        btn.classList.remove('copied');
      }, 2000);
    } catch {
      alert('Copy failed — please select the text manually.');
    }
  }

  // Allow Ctrl+Enter to generate
  document.addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') generateAds();
  });
</script>

</body>
</html>
